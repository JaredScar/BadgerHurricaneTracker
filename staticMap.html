<body class="page-map">

        <img src="assets/css/img/badger-hurricane-tracker.gif" alt="">

<div class="map-shell">
    <div id="map" class="map"></div>
    <aside class="map-panel">
        <div class="panel-head">
            <h2>Active storms</h2>
            <button type="button" id="basemap-toggle" class="map-toggle">Street map</button>
        </div>
        <div id="storm-list">
            <p class="empty-state">Loading tracks…</p>
        </div>
        <p class="panel-note">This view stays fixed. The solid line is the 3-day forecast, the dashed line runs through day 5, and the pale area is the uncertainty cone.</p>
    </aside>
    <div id="map-popup" class="map-popup"></div>
</div>
